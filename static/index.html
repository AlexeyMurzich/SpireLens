<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpireLens · История восхождений</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<aside><a class="brand" href="/">◈ <span>SpireLens<small>SLAY THE SPIRE 2</small></span></a><div class="nav-label">ВАШИ ВОСХОЖДЕНИЯ</div><nav>
<button data-tab="overview" class="active">◉ Обзор</button><button data-tab="runs">☷ История забегов</button><button data-tab="cards">♧ Карты и реликвии</button><button data-tab="enemies">⚔ Опасные встречи</button><button data-tab="sources">⌁ Источники данных</button></nav><div class="aside-bottom"><span class="dot"></span> Работает на вашем компьютере<br><small>Без загрузки данных в интернет</small></div></aside>
<main><header><div><div class="eyebrow">ЛИЧНЫЙ ДНЕВНИК ШПИЛЯ</div><h1 id="page-title">Каждый забег — опыт.</h1><p id="subtitle">Загружаем историю восхождений…</p></div><button id="refresh" class="secondary">↻ Обновить</button></header>
<section class="filters" aria-label="Фильтры"><label>Steam-профиль<select id="profile"></select></label><label>Персонаж<select id="character"><option value="">Все персонажи</option></select></label><label>Вознесение<input id="ascension" type="number" min="0" max="100" placeholder="Все уровни"></label><label>Режим<select id="mode"><option value="standard">Обычный</option><option value="">Все режимы</option><option value="daily">Ежедневный</option><option value="custom">Особый</option></select></label><label>Команда<select id="party"><option value="solo">Одиночная игра</option><option value="coop">Кооператив</option><option value="">Все</option></select></label><button id="more" class="secondary">Ещё фильтры</button></section>
<section id="extra-filters" class="filters hidden"><label>Результат<select id="outcome"><option value="">Все результаты</option><option value="finished">Победы и поражения (*)</option><option value="win">Победа</option><option value="loss">Поражение</option><option value="abandoned">Прерван / перезапуск</option></select></label><label>С даты<input id="from" type="date"></label><label>По дату<input id="to" type="date"></label><label>Не раньше этажа<input id="min_floor" type="number" min="0" value="0"></label><label>Версия<select id="version"><option value="">Все версии</option></select></label><label class="check"><input id="exclude_abandoned" type="checkbox">Исключить флаг «прерван»</label></section>
<div id="error" role="alert" class="hidden"></div><div id="content" aria-live="polite"></div>
<footer><span id="status">Чтение локальной истории</span><span>Обновление каждые 15 секунд · Время этого компьютера</span></footer></main>
<dialog id="detail"><div class="dialog-top"><span>РАЗБОР ЗАБЕГА</span><button id="close-detail" aria-label="Закрыть">✕</button></div><div id="detail-content"></div></dialog>
</body></html>
